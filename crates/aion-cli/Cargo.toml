[package]
name = "aion-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "aion"
path = "src/main.rs"

[dependencies]
aion-ast.workspace = true
aion-checker.workspace = true
aion-ext.workspace = true
aion-ext-firebase = { path = "../../plugins/aion-ext-firebase" }
aion-ext-mongo = { path = "../../plugins/aion-ext-mongo" }
aion-parser.workspace = true
aion-runtime-net = { path = "../aion-runtime-net" }
aion-runtime-ui = { path = "../aion-runtime-ui", default-features = false }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
